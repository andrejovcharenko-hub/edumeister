<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>EduMeister Live - Deutsch A1</title>
    <!-- Підключення Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; }
        .card { background: #334155; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0369a1; }
        .boss-hp { font-size: 24px; color: #ef4444; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>EduMeister Live: Deutsch A1</h1>
    
    <!-- Екран теорії та статусу Боса -->
    <div class="card" id="theory-box">
        <h2 id="lesson-title">Lektion: Trennbare Verben</h2>
        <p id="lesson-rule"><b>Правило:</b> Ich stehe jeden Tag um 7 Uhr <b>auf</b>. (Відокремлювані префікси йдуть у кінець речення).</p>
        <div class="boss-hp">HP Боса (Der Zeit-Räuber): <span id="bossHpValue">1000</span></div>
    </div>

    <!-- Інтерактивне поле для смартфона учня -->
    <div class="card" id="student-controller">
        <h3>⚡ Смартфон-пульт учня (Бос-бій)</h3>
        <p>Завдання: Обери правильну форму дієслова.</p>
        <p><b>Am Abend _____ ich mein Zimmer _____.</b></p>
        <button onclick="submitAnswer(0)">räume ... auf</button>
        <button onclick="submitAnswer(1)">aufräume ...</button>
    </div>
</div>

<script>
    // Конфігурація Firebase (використовуємо вашу існуючу базу даних)
    const firebaseConfig = {
        databaseURL: "https://edumeister-live-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Слідкуємо за рівнем HP Боса в реальному часі
    db.ref('boss/hp').on('snapshot', (snapshot) => {
        // Заглушка для синхронізації
    });

    db.ref('boss/hp').on('value', (snapshot) => {
        const hp = snapshot.val() !== null ? snapshot.val() : 1000;
        document.getElementById('bossHpValue').innerText = hp;
    });

    // Логіка відповіді учня зі смартфона
    function submitAnswer(optionIndex) {
        if (optionIndex === 0) {
            alert('Правильно! Завдано шкоди босу.');
            // Зменшуємо HP боса в хмарі Firebase на 150 од.
            db.ref('boss/hp').transaction((currentHp) => {
                return (currentHp || 1000) - 150;
            });
        } else {
            alert('Помилка! Спробуй ще раз.');
        }
    }
</script>

</body>
</html>
